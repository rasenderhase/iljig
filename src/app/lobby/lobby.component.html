<div class="lobby-container">
  <h1>ILJIG Lobby</h1>

  @if (!store.currentLobby()) {
    <div class="actions">
      <div class="join-section">
        <h3>Join a Game</h3>
        <input [ngModel]="pin()" (ngModelChange)="pin.set($event)" placeholder="Enter PIN" maxlength="6">
        <input [ngModel]="playerName()" (ngModelChange)="playerName.set($event)" placeholder="Your Name">
        <button (click)="joinGame()" [disabled]="store.isLoading()">Join</button>
      </div>

      <hr>

      <div class="host-section">
        <h3>Host a New Game</h3>
        <input [ngModel]="playerName()" (ngModelChange)="playerName.set($event)" placeholder="Your Name">
        <button (click)="hostGame()" [disabled]="store.isLoading()">Host Game</button>
      </div>

      @if (store.error()) {
        <div class="error">
          {{ store.error() }}
        </div>
      }
    </div>
  }
</div>
