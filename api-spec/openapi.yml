openapi: 3.0.3
info:
  title: ILJIG API
  description: API for ILJIG (I Love Just It Games)
  version: 1.0.0
servers:
  - url: http://localhost:4200
    description: Local development server
paths:
  /api/game/create:
    post:
      tags:
        - Game
      summary: Initialize a game
      operationId: createGame
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCreatedResponse'
  /api/game/join:
    post:
      tags:
        - Game
      summary: Join a game via PIN
      operationId: joinGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGameRequest'
      responses:
        '200':
          description: Joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinGameResponse'
        '404':
          description: Game not found
  /api/game/{pin}:
    get:
      tags:
        - Game
      summary: Get game status (spectator view)
      operationId: getGameStatus
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current game status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatus'
        '404':
          description: Game not found
  /api/game/{pin}/player/{playerId}:
    get:
      tags:
        - Game
      summary: Get game status for a specific player
      operationId: getPlayerGameStatus
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current game status for player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatus'
        '404':
          description: Game or Player not found
  /api/game/{pin}/start:
    post:
      tags:
        - Game
      summary: Start the game
      operationId: startGame
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
        - name: secret
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Game started successfully
        '403':
          description: Only host can start the game
        '404':
          description: Game not found

components:
  schemas:
    GameCreatedResponse:
      type: object
      properties:
        pin:
          type: string
        secret:
          type: string
    JoinGameResponse:
      type: object
      properties:
        playerId:
          type: string
        gameStatus:
          $ref: '#/components/schemas/GameStatus'
    GameStatus:
      type: object
      properties:
        pin:
          type: string
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        status:
          type: string
          enum: [WAITING, STARTING, IN_GAME]
        isHost:
          type: boolean
          description: True if the requesting user is the host (only set when called via player endpoint with correct playerId/secret)
    Player:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isHost:
          type: boolean
    JoinGameRequest:
      type: object
      properties:
        pin:
          type: string
        playerName:
          type: string
        secret:
          type: string
          description: Secret provided if the creator is joining as host
      required:
        - pin
        - playerName
