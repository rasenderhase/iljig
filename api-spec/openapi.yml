openapi: 3.0.3
info:
  title: ILJIG API
  description: API for ILJIG (I Love Just It Games)
  version: 1.0.0
servers:
  - url: http://localhost:4200
    description: Local development server
paths:
  /api/lobby/create:
    post:
      tags:
        - Lobby
      summary: Initialize a game
      operationId: createLobby
      responses:
        '201':
          description: Lobby created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyCreatedResponse'
  /api/lobby/join:
    post:
      tags:
        - Lobby
      summary: Join a game via PIN
      operationId: joinLobby
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinLobbyRequest'
      responses:
        '200':
          description: Joined successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinLobbyResponse'
        '404':
          description: Lobby not found
  /api/lobby/{pin}:
    get:
      tags:
        - Lobby
      summary: Get lobby status (spectator view)
      operationId: getLobbyStatus
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current lobby status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyStatus'
        '404':
          description: Lobby not found
  /api/lobby/{pin}/player/{playerId}:
    get:
      tags:
        - Lobby
      summary: Get lobby status for a specific player
      operationId: getPlayerLobbyStatus
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current lobby status for player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyStatus'
        '404':
          description: Lobby or Player not found
  /api/game/{pin}/start:
    post:
      tags:
        - Game
      summary: Start the game
      operationId: startGame
      parameters:
        - name: pin
          in: path
          required: true
          schema:
            type: string
        - name: secret
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Game started successfully
        '403':
          description: Only host can start the game
        '404':
          description: Game not found

components:
  schemas:
    LobbyCreatedResponse:
      type: object
      properties:
        pin:
          type: string
        secret:
          type: string
    JoinLobbyResponse:
      type: object
      properties:
        playerId:
          type: string
        lobbyStatus:
          $ref: '#/components/schemas/LobbyStatus'
    LobbyStatus:
      type: object
      properties:
        pin:
          type: string
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        status:
          type: string
          enum: [WAITING, STARTING, IN_GAME]
        isHost:
          type: boolean
          description: True if the requesting user is the host (only set when called via player endpoint with correct playerId/secret)
    Player:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isHost:
          type: boolean
    JoinLobbyRequest:
      type: object
      properties:
        pin:
          type: string
        playerName:
          type: string
        secret:
          type: string
          description: Secret provided if the creator is joining as host
      required:
        - pin
        - playerName
